kind = "web"
previewPath = "/"
title = "EcoCycle AI"
description = "A device reuse and e-waste platform that assesses electronics, estimates reuse and scrap value, guides safe data sanitization, and routes devices to resale or responsible recycling."
version = "1.0.0"
id = "artifacts/ecocycle-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18523

[services.development]
run = "pnpm --filter @workspace/ecocycle-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ecocycle-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/ecocycle-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18523"
BASE_PATH = "/"
