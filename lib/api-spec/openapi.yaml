openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: EcoCycle AI device reuse and responsible recycling services
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ecocycle
    description: EcoCycle AI assessment and impact services
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ecocycle/dashboard:
    get:
      operationId: getEcoCycleDashboard
      tags: [ecocycle]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /ecocycle/devices:
    get:
      operationId: listEcoCycleDevices
      tags: [ecocycle]
      summary: List device assessments
      responses:
        "200":
          description: Device assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
    post:
      operationId: createEcoCycleDevice
      tags: [ecocycle]
      summary: Save a device assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceInput"
      responses:
        "201":
          description: Saved device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
  /ecocycle/devices/{deviceId}:
    delete:
      operationId: deleteEcoCycleDevice
      tags: [ecocycle]
      summary: Delete a device assessment
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Device deleted
  /ecocycle/identify:
    post:
      operationId: identifyEcoCycleDevice
      tags: [ecocycle]
      summary: Identify a device from user-provided evidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifyInput"
      responses:
        "200":
          description: Device identification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceIdentification"
  /ecocycle/diagnostics:
    post:
      operationId: runEcoCycleDiagnostics
      tags: [ecocycle]
      summary: Assess user-reported and simulated device diagnostics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosticsInput"
      responses:
        "200":
          description: Diagnostic result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticResult"
  /ecocycle/valuation:
    post:
      operationId: calculateEcoCycleValuation
      tags: [ecocycle]
      summary: Calculate estimated resale, trade-in, and scrap values
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValuationInput"
      responses:
        "200":
          description: Estimated values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Valuation"
  /ecocycle/sanitization:
    post:
      operationId: startEcoCycleSanitization
      tags: [ecocycle]
      summary: Record a simulated sanitization workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SanitizationInput"
      responses:
        "201":
          description: Sanitization record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SanitizationRecord"
  /ecocycle/certificates:
    get:
      operationId: listEcoCycleCertificates
      tags: [ecocycle]
      summary: List sanitization certificates
      responses:
        "200":
          description: Certificates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Certificate"
    post:
      operationId: createEcoCycleCertificate
      tags: [ecocycle]
      summary: Create certificate integrity metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateInput"
      responses:
        "201":
          description: Certificate metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
  /ecocycle/routing:
    post:
      operationId: evaluateEcoCycleRouting
      tags: [ecocycle]
      summary: Apply the authoritative condition-based route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutingInput"
      responses:
        "200":
          description: Routing decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingResult"
  /ecocycle/partners:
    get:
      operationId: listEcoCyclePartners
      tags: [ecocycle]
      summary: List demo partners matching a route
      parameters:
        - name: route
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Route"
      responses:
        "200":
          description: Matching partners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partner"
  /ecocycle/credits:
    get:
      operationId: getEcoCycleCredits
      tags: [ecocycle]
      summary: Get demo credit balance and transaction history
      responses:
        "200":
          description: Eco-Credits wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditWallet"
  /ecocycle/impact:
    get:
      operationId: getEcoCycleImpact
      tags: [ecocycle]
      summary: Get estimated environmental impact totals
      responses:
        "200":
          description: Environmental impact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentalImpact"
  /ecocycle/history:
    get:
      operationId: listEcoCycleHistory
      tags: [ecocycle]
      summary: List prior assessments
      responses:
        "200":
          description: Assessment history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assessment"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DeviceCategory:
      type: string
      enum: [Smartphone, Laptop, Tablet, Desktop, Monitor, Smartwatch, Gaming Console, Camera, Router, Printer, Keyboard, Mouse, Headphones, Television, Other Electronics]
    Condition:
      type: string
      enum: [WORKING, REPAIRABLE, NON_WORKING, DEAD, SCRAP]
    Route:
      type: string
      enum: [RESALE, RECYCLING]
    DeviceInput:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/DeviceCategory"
        brand:
          type: string
        model:
          type: string
        generation:
          type: string
        purchaseYear:
          type: integer
        storage:
          type: string
        ram:
          type: string
        condition:
          $ref: "#/components/schemas/Condition"
        batteryHealth:
          type: number
        physicalDamage:
          type: string
        screenCondition:
          type: string
        powersOn:
          type: boolean
        hasPersonalData:
          type: boolean
        location:
          type: string
        source:
          type: string
          enum: [USER_REPORTED, AI_ESTIMATED, SIMULATED, DEMO_DATA]
      required: [category, condition, powersOn]
    Device:
      allOf:
        - $ref: "#/components/schemas/DeviceInput"
        - type: object
          properties:
            id:
              type: string
            createdAt:
              type: string
              format: date-time
            confidence:
              type: number
          required: [id, createdAt]
    IdentifyInput:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/DeviceCategory"
        description:
          type: string
        imageName:
          type: string
        imageSize:
          type: integer
      required: [category]
    DeviceIdentification:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/DeviceCategory"
        brand:
          type: string
        model:
          type: string
        generation:
          type: string
        estimatedYear:
          type: integer
        confidence:
          type: number
        evidence:
          type: array
          items:
            type: string
        uncertainties:
          type: array
          items:
            type: string
        source:
          type: string
          enum: [AI_ESTIMATED, SIMULATED]
      required: [category, brand, model, confidence, evidence, uncertainties, source]
    DiagnosticsInput:
      type: object
      properties:
        device:
          $ref: "#/components/schemas/DeviceInput"
      required: [device]
    DiagnosticTest:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [PASS, WARNING, FAIL, NOT_APPLICABLE]
        score:
          type: integer
        source:
          type: string
          enum: [BROWSER_VERIFIED, USER_REPORTED, AI_ESTIMATED, SIMULATED]
        explanation:
          type: string
        recommendation:
          type: string
      required: [name, status, score, source, explanation, recommendation]
    DiagnosticResult:
      type: object
      properties:
        overallCondition:
          $ref: "#/components/schemas/Condition"
        overallScore:
          type: integer
        confidence:
          type: number
        tests:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticTest"
        recommendedAction:
          type: string
      required: [overallCondition, overallScore, confidence, tests, recommendedAction]
    ValuationInput:
      type: object
      properties:
        device:
          $ref: "#/components/schemas/DeviceInput"
      required: [device]
    Valuation:
      type: object
      properties:
        currency:
          type: string
          enum: [INR, USD, EUR, GBP]
        resaleValue:
          type: number
        tradeInValue:
          type: number
        scrapValue:
          type: number
        valueDifference:
          type: number
        confidence:
          type: number
        assumptions:
          type: array
          items:
            type: string
      required: [currency, resaleValue, tradeInValue, scrapValue, valueDifference, confidence, assumptions]
    SanitizationInput:
      type: object
      properties:
        deviceName:
          type: string
        deviceIdentifier:
          type: string
        storageType:
          type: string
        method:
          type: string
      required: [deviceName, storageType, method]
    SanitizationRecord:
      type: object
      properties:
        id:
          type: string
        certificateId:
          type: string
        deviceName:
          type: string
        deviceIdentifier:
          type: string
        method:
          type: string
        standard:
          type: string
        status:
          type: string
        verificationStatus:
          type: string
        timestamp:
          type: string
          format: date-time
        certificateHash:
          type: string
      required: [id, certificateId, deviceName, method, standard, status, verificationStatus, timestamp, certificateHash]
    CertificateInput:
      type: object
      properties:
        record:
          $ref: "#/components/schemas/SanitizationRecord"
      required: [record]
    Certificate:
      allOf:
        - $ref: "#/components/schemas/SanitizationRecord"
    RoutingInput:
      type: object
      properties:
        condition:
          $ref: "#/components/schemas/Condition"
        deviceName:
          type: string
      required: [condition]
    RoutingResult:
      type: object
      properties:
        route:
          $ref: "#/components/schemas/Route"
        condition:
          $ref: "#/components/schemas/Condition"
        reason:
          type: string
        nextSteps:
          type: array
          items:
            type: string
      required: [route, condition, reason, nextSteps]
    Partner:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        address:
          type: string
        distanceKm:
          type: number
        verified:
          type: boolean
        demo:
          type: boolean
        acceptedCategories:
          type: array
          items:
            type: string
      required: [id, name, type, address, distanceKm, verified, demo, acceptedCategories]
    CreditTransaction:
      type: object
      properties:
        id:
          type: string
        amount:
          type: integer
        description:
          type: string
        date:
          type: string
          format: date-time
      required: [id, amount, description, date]
    CreditWallet:
      type: object
      properties:
        balance:
          type: integer
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/CreditTransaction"
      required: [balance, transactions]
    EnvironmentalImpact:
      type: object
      properties:
        co2SavedKg:
          type: number
        devicesProcessed:
          type: integer
        devicesRecycled:
          type: integer
        devicesReused:
          type: integer
        materialRecoveredKg:
          type: number
        landfillDiversionKg:
          type: number
        confidence:
          type: number
        source:
          type: string
      required: [co2SavedKg, devicesProcessed, devicesRecycled, devicesReused, materialRecoveredKg, landfillDiversionKg, confidence, source]
    Assessment:
      type: object
      properties:
        id:
          type: string
        deviceName:
          type: string
        category:
          $ref: "#/components/schemas/DeviceCategory"
        condition:
          $ref: "#/components/schemas/Condition"
        route:
          $ref: "#/components/schemas/Route"
        value:
          type: number
        date:
          type: string
          format: date-time
        source:
          type: string
      required: [id, deviceName, category, condition, route, value, date, source]
    DashboardSummary:
      type: object
      properties:
        devicesProcessed:
          type: integer
        ecoCredits:
          type: integer
        co2SavedKg:
          type: number
        devicesReused:
          type: integer
        devicesRecycled:
          type: integer
        recentAssessments:
          type: array
          items:
            $ref: "#/components/schemas/Assessment"
      required: [devicesProcessed, ecoCredits, co2SavedKg, devicesReused, devicesRecycled, recentAssessments]

